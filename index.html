<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書記録</title>
<style>
  :root{
    --bg:#efe6d3;
    --paper:#faf5e8;
    --line:#ddcda4;
    --ink:#352c1f;
    --sub:#8c7c58;
    --accent:#a9432f;
    --accent-soft:#c98c4a;
    --star:#c98c4a;
    --serif:"Hiragino Mincho ProN","Yu Mincho","游明朝",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(ellipse at 15% -5%, rgba(169,67,47,.10), transparent 50%),
      radial-gradient(ellipse at 100% 10%, rgba(201,140,74,.14), transparent 55%),
      repeating-linear-gradient(0deg, rgba(140,124,88,.035) 0px, rgba(140,124,88,.035) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.8;
    min-height:100vh;
    padding:0 0 90px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  /* ---- hero / shelf header ---- */
  .hero{
    text-align:center;
    padding:54px 18px 30px;
    position:relative;
  }
  .hero svg{width:120px;height:auto;opacity:.85;margin-bottom:6px}
  .hero .kicker{
    font-size:.72rem;letter-spacing:.4em;color:var(--accent-soft);
    text-transform:uppercase;margin-bottom:10px;
  }
  h1{
    font-size:2.1rem;letter-spacing:.22em;font-weight:700;color:var(--ink);
  }
  .hero .sub{color:var(--sub);font-size:.85rem;letter-spacing:.1em;margin-top:12px}

  /* ---- stats strip (shareable) ---- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
    margin:0 0 30px;
  }
  .stat{background:var(--paper);padding:18px 10px;text-align:center}
  .stat .num{font-size:1.5rem;color:var(--accent);font-weight:700;letter-spacing:.02em}
  .stat .lbl{font-size:.7rem;color:var(--sub);letter-spacing:.08em;margin-top:4px}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:26px 24px;
    margin-bottom:28px;
    box-shadow:0 3px 14px rgba(60,52,40,.06);
  }
  .panel h2{
    font-size:.95rem;letter-spacing:.16em;color:var(--accent);
    margin-bottom:18px;padding-bottom:12px;border-bottom:1px dashed var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{content:"";width:5px;height:5px;background:var(--accent-soft);border-radius:50%;display:inline-block}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:6px;letter-spacing:.08em}
  .field input[type=text],.field input[type=date],.field textarea,.field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
    background:#fff;color:var(--ink);font-family:inherit;font-size:.92rem;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent-soft)}
  .field textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .star-picker{display:flex;gap:6px;font-size:1.5rem;user-select:none}
  .star-picker span{cursor:pointer;color:#e0d3b0;transition:.12s}
  .star-picker span.on{color:var(--star)}
  .star-picker span:hover{transform:scale(1.12)}

  .btn{
    display:inline-block;padding:10px 26px;border-radius:999px;border:1px solid var(--accent);
    background:var(--accent);color:#faf6ec;font-family:inherit;font-size:.88rem;letter-spacing:.12em;
    cursor:pointer;transition:.15s;
  }
  .btn:hover{background:#8a3524}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover{background:rgba(169,67,47,.08)}
  .btn.small{padding:6px 16px;font-size:.75rem}
  .btn.danger{border-color:#9a6b52;color:#9a6b52;background:transparent}
  .btn.danger:hover{background:rgba(154,107,82,.1)}

  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;
  }
  .toolbar input[type=text]{
    flex:1;min-width:150px;padding:10px 13px;border:1px solid var(--line);border-radius:5px;
    background:var(--paper);font-family:inherit;font-size:.9rem;color:var(--ink);
  }
  .toolbar select{
    padding:10px 11px;border:1px solid var(--line);border-radius:5px;background:var(--paper);
    font-family:inherit;font-size:.84rem;color:var(--ink);
  }

  .shelf-label{
    display:flex;align-items:center;gap:10px;margin:8px 0 16px;
    font-size:.8rem;letter-spacing:.14em;color:var(--sub);
  }
  .shelf-label::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---- book cards: shelf gallery ---- */
  .shelf{display:grid;gap:14px}
  .book{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:20px 22px 18px;position:relative;
    border-left:4px solid var(--accent-soft);
    transition:box-shadow .15s;
  }
  .book:hover{box-shadow:0 4px 16px rgba(60,52,40,.08)}
  .book .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .book .stars{color:var(--star);font-size:.95rem;letter-spacing:2px;white-space:nowrap}
  .book h3{font-size:1.15rem;margin:8px 0 3px;letter-spacing:.03em;color:var(--ink)}
  .book .author{color:var(--sub);font-size:.85rem}
  .book .date{
    color:var(--accent-soft);font-size:.72rem;margin-top:8px;letter-spacing:.08em;
    font-family:var(--serif);
  }
  .book .memo{
    margin-top:12px;font-size:.87rem;color:var(--ink);white-space:pre-wrap;line-height:1.8;
    padding-top:12px;border-top:1px dashed var(--line);
  }
  .book .actions{margin-top:14px;display:flex;gap:8px}
  .empty{text-align:center;color:var(--sub);padding:50px 0;font-size:.9rem;letter-spacing:.05em}

  /* ---- real bookshelf visualization ---- */
  .bookshelf-outer{
    position:relative;overflow-x:auto;overflow-y:hidden;
    padding:26px 6px 0;margin:0 -6px;
    -webkit-overflow-scrolling:touch;
  }
  .bookshelf-row{
    display:flex;align-items:flex-end;gap:4px;
    min-height:150px;padding:0 8px;position:relative;z-index:2;
  }
  .plank{
    height:16px;margin:-2px 0 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.15), transparent 40%),
      linear-gradient(180deg,#c9a468,#8a6338 85%);
    border-radius:2px;
    box-shadow:0 8px 14px rgba(60,45,20,.28), 0 1px 0 rgba(255,255,255,.2) inset;
  }
  .spine{
    flex-shrink:0;border-radius:5px 5px 2px 2px;cursor:pointer;
    writing-mode:vertical-rl;text-orientation:mixed;
    display:flex;align-items:flex-start;justify-content:center;
    padding:12px 0 8px;color:#faf6ec;font-size:.72rem;letter-spacing:.06em;
    box-shadow:
      inset -4px 0 7px rgba(0,0,0,.2),
      inset 3px 0 5px rgba(255,255,255,.14),
      0 2px 4px rgba(60,45,20,.2);
    transition:transform .15s ease;
  }
  .spine:hover{transform:translateY(-5px)}
  .spine.selected{
    transform:translateY(-9px);
    box-shadow:
      inset -4px 0 7px rgba(0,0,0,.2),
      inset 3px 0 5px rgba(255,255,255,.14),
      0 8px 12px rgba(60,45,20,.3);
  }
  .spine .spine-text{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;
  }
  .shelf-hint{
    text-align:center;font-size:.72rem;color:var(--sub);
    margin-top:12px;letter-spacing:.05em;
  }
  #detail-wrap .book{margin-bottom:0}

  @media(max-width:480px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .stat .num{font-size:1.2rem}
    h1{font-size:1.7rem;letter-spacing:.14em}
  }

  /* ---- 認証画面 ---- */
  .auth-wrap{max-width:380px;margin:80px auto;padding:0 18px}
  .auth-tabs{display:flex;gap:8px;margin-bottom:18px}
  .auth-tabs button{
    flex:1;padding:10px;border:1px solid var(--line);background:var(--paper);
    color:var(--sub);font-family:inherit;font-size:.85rem;letter-spacing:.08em;
    border-radius:6px;cursor:pointer;
  }
  .auth-tabs button.active{background:var(--accent);color:#faf6ec;border-color:var(--accent)}
  .auth-error{color:#a9432f;font-size:.8rem;margin-top:10px;min-height:1.2em}
  .auth-hint{color:var(--sub);font-size:.75rem;margin-top:14px;text-align:center}
  .user-bar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.78rem;color:var(--sub);margin:0 0 14px;letter-spacing:.05em;
  }
  .user-bar b{color:var(--ink)}
  .member-notice{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:20px;font-size:.82rem;color:var(--sub);
  }
  .plan-banner{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    background:#fdf3e2;border:1px solid #e8cf9c;border-radius:8px;
    padding:12px 16px;margin-bottom:20px;font-size:.82rem;color:var(--ink);
  }
</style>
</head>
<body>

<div class="auth-wrap" id="auth-wrap" style="display:none;">
  <div class="auth-tabs">
    <button id="tab-login" class="active">ログイン</button>
    <button id="tab-signup">はじめて使う</button>
  </div>
  <div class="panel" id="login-panel">
    <div class="field">
      <label>ユーザー名</label>
      <input type="text" id="login-username" placeholder="ユーザー名">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="login-password" placeholder="パスワード">
    </div>
    <button class="btn" id="login-btn">ログイン</button>
    <div class="auth-error" id="login-error"></div>
  </div>
  <div class="panel" id="signup-panel" style="display:none;">
    <div class="field">
      <label>ユーザー名（3文字以上）</label>
      <input type="text" id="signup-username" placeholder="ユーザー名">
    </div>
    <div class="field">
      <label>パスワード（8文字以上）</label>
      <input type="password" id="signup-password" placeholder="パスワード">
    </div>
    <button class="btn" id="signup-btn">登録する</button>
    <div class="auth-error" id="signup-error"></div>
  </div>
</div>

<div class="wrap" id="app-content" style="display:none;">
  <div class="hero">
    <div class="user-bar" id="user-bar">
      <span><b id="user-name"></b>（<span id="user-role"></span>）<span id="plan-badge" style="display:none;color:#a9432f;"> ／ 無制限プラン</span></span>
      <button class="btn small ghost" id="logout-btn">ログアウト</button>
    </div>
    <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,50 Q10,15 45,12" fill="none" stroke="#c98c4a" stroke-width="1.4"/>
      <path d="M110,50 Q110,15 75,12" fill="none" stroke="#c98c4a" stroke-width="1.4"/>
      <circle cx="45" cy="10" r="2.3" fill="#a9432f"/>
      <circle cx="75" cy="10" r="2.3" fill="#a9432f"/>
      <path d="M4,50 H116" stroke="#ddcda4" stroke-width="1.2"/>
    </svg>
    <div class="kicker">Reading Notes</div>
    <h1>読書記録</h1>
    <div class="sub">読んだ本を、棚に並べていく</div>
  </div>

  <div class="plan-banner" id="plan-banner" style="display:none;">
    <span id="plan-banner-text"></span>
    <button class="btn small" id="upgrade-btn">無制限プランにする（月500円・テスト決済）</button>
  </div>

  <div class="plan-banner" id="paid-plan-bar" style="display:none;">
    <span>無制限プランをご利用中です</span>
    <button class="btn small ghost" id="cancel-plan-btn">解約する</button>
  </div>

  <div class="plan-banner" id="payment-failed-banner" style="display:none;background:#fdeaea;border-color:#e0a3a3;">
    <span>お支払いに失敗しています。カード情報をご確認ください（このままだと停止される場合があります）</span>
    <button class="btn small ghost" id="fix-payment-btn">カードを確認する</button>
  </div>

  <div class="panel" id="recommend-panel">
    <h2>AIによるおすすめ <span style="font-size:.7rem;color:var(--accent);font-weight:600;">有料プラン限定</span></h2>
    <p style="color:var(--sub);font-size:.85rem;margin-bottom:12px;">今の本棚の傾向から、次に読む本をAIが提案します。</p>
    <button class="btn small" id="recommend-btn">AIにおすすめしてもらう</button>
    <div class="auth-error" id="recommend-error"></div>
    <div id="recommend-result" style="display:none;margin-top:14px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:.85rem;white-space:pre-wrap;line-height:1.7;"></div>
  </div>

  <div class="panel" id="audit-panel" style="display:none;">
    <h2>監査ログ <span style="font-size:.7rem;color:var(--sub);font-weight:600;">管理者のみ</span></h2>
    <p style="color:var(--sub);font-size:.85rem;margin-bottom:12px;">誰が・いつ・何をしたかの記録（最新200件）。</p>
    <button class="btn small ghost" id="audit-log-btn">表示する</button>
    <div id="audit-log-list" style="display:none;margin-top:14px;max-height:260px;overflow-y:auto;font-family:monospace;font-size:.78rem;line-height:1.8;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel" id="add-panel">
    <h2>本を記録する</h2>
    <div class="field">
      <label>タイトル</label>
      <input type="text" id="f-title" placeholder="例：夜と霧">
    </div>
    <div class="row2">
      <div class="field">
        <label>著者</label>
        <input type="text" id="f-author" placeholder="例：ヴィクトール・フランクル">
      </div>
      <div class="field">
        <label>読んだ日</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="field">
      <label>棚（カテゴリ）</label>
      <select id="f-category"></select>
    </div>
    <div class="field">
      <label>評価</label>
      <div class="star-picker" id="f-stars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>メモ・感想</label>
      <textarea id="f-memo" placeholder="心に残ったこと、引用など"></textarea>
    </div>
    <button class="btn" id="save-btn">棚に並べる</button>
    <button class="btn ghost" id="cancel-edit-btn" style="display:none;margin-left:8px;">編集をやめる</button>
  </div>

  <div class="member-notice" id="member-notice" style="display:none;">
    記録の追加・編集・削除は管理者（admin）だけができます。あなたは一般（member）権限のため、閲覧のみできます。
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="タイトル・著者で検索">
    <select id="sort">
      <option value="date-desc">読んだ日：新しい順</option>
      <option value="date-asc">読んだ日：古い順</option>
      <option value="rating-desc">評価：高い順</option>
      <option value="rating-asc">評価：低い順</option>
    </select>
  </div>
  <div class="shelf-label" id="count">本棚</div>
  <div class="shelf-hint" id="shelf-hint"></div>
  <div id="shelves"></div>
  <div class="detail-wrap" id="detail-wrap"></div>
</div>

<script>
  let editingId = null;
  let selectedId = null;
  let booksCache = [];
  let currentUser = null;

  // ---- 認証 ----
  async function fetchMe(){
    try{
      const res = await fetch("/api/me");
      const data = await res.json();
      return data.user;
    }catch(e){
      return null;
    }
  }

  function applyRoleUi(){
    const isAdmin = currentUser && currentUser.role === "admin";
    document.getElementById("add-panel").style.display = isAdmin ? "" : "none";
    document.getElementById("member-notice").style.display = isAdmin ? "none" : "";
    document.getElementById("audit-panel").style.display = isAdmin ? "" : "none";
  }

  document.getElementById("audit-log-btn").addEventListener("click", async ()=>{
    const btn = document.getElementById("audit-log-btn");
    const listEl = document.getElementById("audit-log-list");
    btn.disabled = true;
    try{
      const res = await fetch("/api/audit-log");
      const data = await res.json();
      if(!data.ok){
        alert(data.error || "取得できませんでした");
        return;
      }
      listEl.innerHTML = data.logs.map(l =>
        `${escapeHtml(l.created_at)} ｜ ${escapeHtml(l.username || "(不明)")} ｜ ${escapeHtml(l.action)}${l.detail ? " ｜ " + escapeHtml(l.detail) : ""}`
      ).join("<br>");
      listEl.style.display = "";
    }finally{
      btn.disabled = false;
    }
  });

  function applyPlanUi(){
    const banner = document.getElementById("plan-banner");
    const badge = document.getElementById("plan-badge");
    const paidBar = document.getElementById("paid-plan-bar");
    const failedBanner = document.getElementById("payment-failed-banner");
    const isPaid = currentUser && currentUser.plan === "paid";
    badge.style.display = isPaid ? "" : "none";
    failedBanner.style.display = (currentUser && currentUser.payment_failed_at) ? "" : "none";

    if(!currentUser || isPaid){
      banner.style.display = "none";
    }else{
      banner.style.display = "";
      document.getElementById("plan-banner-text").textContent =
        `無料プランは本を${10}冊まで記録できます（現在${booksCache.length}冊）`;
    }
    paidBar.style.display = isPaid ? "" : "none";

    const recommendBtn = document.getElementById("recommend-btn");
    recommendBtn.textContent = isPaid ? "AIにおすすめしてもらう" : "🔒 AIにおすすめしてもらう（有料プラン限定）";
  }

  async function goToStripe(endpoint, btn, busyText, idleText){
    btn.disabled = true;
    btn.textContent = busyText;
    try{
      const res = await fetch(endpoint, { method: "POST" });
      const data = await res.json();
      if(!data.ok){
        alert(data.error || "ページを開けませんでした");
        return;
      }
      window.location.href = data.url;
    }catch(e){
      alert("サーバーに接続できませんでした");
    }finally{
      btn.disabled = false;
      btn.textContent = idleText;
    }
  }

  document.getElementById("upgrade-btn").addEventListener("click", ()=>{
    const btn = document.getElementById("upgrade-btn");
    goToStripe("/api/checkout", btn, "決済ページを準備中…", "無制限プランにする（月500円・テスト決済）");
  });

  document.getElementById("cancel-plan-btn").addEventListener("click", ()=>{
    const btn = document.getElementById("cancel-plan-btn");
    goToStripe("/api/billing-portal", btn, "準備中…", "解約する");
  });

  document.getElementById("fix-payment-btn").addEventListener("click", ()=>{
    const btn = document.getElementById("fix-payment-btn");
    goToStripe("/api/billing-portal", btn, "準備中…", "カードを確認する");
  });

  document.getElementById("recommend-btn").addEventListener("click", async ()=>{
    const btn = document.getElementById("recommend-btn");
    const errorEl = document.getElementById("recommend-error");
    const resultEl = document.getElementById("recommend-result");
    errorEl.textContent = "";
    resultEl.style.display = "none";

    if(!currentUser || currentUser.plan !== "paid"){
      errorEl.textContent = "この機能は有料プランでご利用いただけます。";
      return;
    }

    btn.disabled = true;
    btn.textContent = "考え中…";
    try{
      const res = await fetch("/api/recommend", { method: "POST" });
      const data = await res.json();
      if(!data.ok){
        errorEl.textContent = data.error || "おすすめを取得できませんでした";
        return;
      }
      resultEl.textContent = data.text;
      resultEl.style.display = "";
    }catch(e){
      errorEl.textContent = "サーバーに接続できませんでした";
    }finally{
      btn.disabled = false;
      btn.textContent = "AIにおすすめしてもらう";
    }
  });

  async function handleCheckoutRedirect(){
    const params = new URLSearchParams(window.location.search);
    const checkout = params.get("checkout");
    if(!checkout) return;
    if(checkout === "success"){
      const sessionId = params.get("session_id");
      const res = await fetch(`/api/checkout/confirm?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      if(data.ok){
        alert("お支払いが確認できました。無制限プランになりました🎉");
        currentUser.plan = "paid";
      }else{
        alert(data.error || "お支払いの確認に失敗しました");
      }
    }
    window.history.replaceState({}, "", window.location.pathname);
  }

  async function startApp(){
    document.getElementById("auth-wrap").style.display = "none";
    document.getElementById("app-content").style.display = "";
    document.getElementById("user-name").textContent = currentUser.username;
    document.getElementById("user-role").textContent = currentUser.role === "admin" ? "管理者" : "一般";
    applyRoleUi();
    await handleCheckoutRedirect();
    await render();
  }

  async function initAuth(){
    currentUser = await fetchMe();
    if(currentUser){
      startApp();
    }else{
      document.getElementById("app-content").style.display = "none";
      document.getElementById("auth-wrap").style.display = "";
    }
  }

  function clearAuthForms(){
    document.getElementById("login-username").value = "";
    document.getElementById("login-password").value = "";
    document.getElementById("signup-username").value = "";
    document.getElementById("signup-password").value = "";
    document.getElementById("login-error").textContent = "";
    document.getElementById("signup-error").textContent = "";
  }

  function switchAuthTab(mode){
    const isLogin = mode === "login";
    document.getElementById("tab-login").classList.toggle("active", isLogin);
    document.getElementById("tab-signup").classList.toggle("active", !isLogin);
    document.getElementById("login-panel").style.display = isLogin ? "" : "none";
    document.getElementById("signup-panel").style.display = isLogin ? "none" : "";
  }
  document.getElementById("tab-login").addEventListener("click", ()=>switchAuthTab("login"));
  document.getElementById("tab-signup").addEventListener("click", ()=>switchAuthTab("signup"));

  // サーバーがスリープ中だと起きるまで50秒以上かかることがあるため、
  // ボタンを「送信中」表示にし、失敗時は必ずエラーを出す（無反応に見えないように）
  async function submitAuthForm(url, username, password, btn, errorEl){
    errorEl.textContent = "";
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "送信中…（サーバーが休止中だと時間がかかります）";
    try{
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if(!data.ok){
        errorEl.textContent = data.error || "処理できませんでした";
        return null;
      }
      return data;
    }catch(e){
      errorEl.textContent = "サーバーに接続できませんでした。少し待ってからもう一度お試しください。";
      return null;
    }finally{
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  document.getElementById("login-btn").addEventListener("click", async ()=>{
    const btn = document.getElementById("login-btn");
    const errorEl = document.getElementById("login-error");
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    const data = await submitAuthForm("/api/login", username, password, btn, errorEl);
    if(!data) return;
    currentUser = { username: data.username, role: data.role, plan: data.plan, payment_failed_at: data.payment_failed_at };
    clearAuthForms();
    startApp();
  });

  document.getElementById("signup-btn").addEventListener("click", async ()=>{
    const btn = document.getElementById("signup-btn");
    const errorEl = document.getElementById("signup-error");
    const username = document.getElementById("signup-username").value.trim();
    const password = document.getElementById("signup-password").value;
    const data = await submitAuthForm("/api/signup", username, password, btn, errorEl);
    if(!data) return;
    currentUser = { username: data.username, role: data.role, plan: data.plan, payment_failed_at: data.payment_failed_at };
    clearAuthForms();
    startApp();
  });

  document.getElementById("logout-btn").addEventListener("click", async ()=>{
    await fetch("/api/logout", { method: "POST" });
    currentUser = null;
    document.getElementById("app-content").style.display = "none";
    document.getElementById("auth-wrap").style.display = "";
    switchAuthTab("login");
    clearAuthForms();
  });

  const BASE_CATEGORIES = ["自己啓発", "小説", "トラベル"];
  const DEFAULT_CATEGORY = BASE_CATEGORIES[0];
  let extraCategories = [];
  const ADD_NEW_VALUE = "__add_new__";

  function allCategories(){
    const fromBooks = booksCache.map(b => b.category).filter(Boolean);
    return [...new Set([...BASE_CATEGORIES, ...extraCategories, ...fromBooks])];
  }

  function populateCategorySelect(selected){
    const sel = document.getElementById("f-category");
    const cats = allCategories();
    sel.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")
      + `<option value="${ADD_NEW_VALUE}">＋ 新しい棚を追加...</option>`;
    sel.value = cats.includes(selected) ? selected : DEFAULT_CATEGORY;
  }

  document.getElementById("f-category").addEventListener("change", (e)=>{
    if(e.target.value !== ADD_NEW_VALUE) return;
    const name = (prompt("新しい棚の名前を入力してください") || "").trim();
    if(!name){
      populateCategorySelect(DEFAULT_CATEGORY);
      return;
    }
    if(!extraCategories.includes(name) && !BASE_CATEGORIES.includes(name)){
      extraCategories.push(name);
    }
    populateCategorySelect(name);
  });

  const SPINE_COLORS = ["#a9432f","#c98c4a","#7c8a5e","#5b6b73","#8a5a44","#b5763f","#6b4d3a","#9c6b4f","#4f6d5a","#8a6a8f"];
  function spineColor(title){
    let hash = 0;
    for(let i=0;i<title.length;i++) hash = title.charCodeAt(i) + ((hash<<5)-hash);
    return SPINE_COLORS[Math.abs(hash) % SPINE_COLORS.length];
  }

  async function loadBooks(){
    const res = await fetch("/api/books");
    if(res.status === 401){
      currentUser = null;
      document.getElementById("app-content").style.display = "none";
      document.getElementById("auth-wrap").style.display = "";
      return [];
    }
    booksCache = await res.json();
    return booksCache;
  }
  async function saveBooks(books){
    try{
      const res = await fetch("/api/books", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(books),
      });
      const data = await res.json();
      if(!data.ok) return { ok: false, error: data.error };
      booksCache = books;
      return { ok: true };
    }catch(e){
      return { ok: false, error: "サーバーに接続できませんでした" };
    }
  }

  // ---- 星の入力 ----
  let currentRating = 0;
  const starEls = [...document.querySelectorAll("#f-stars span")];
  starEls.forEach(el=>{
    el.addEventListener("click", ()=>{
      currentRating = Number(el.dataset.v);
      renderStars();
    });
  });
  function renderStars(){
    starEls.forEach(el=>{
      el.classList.toggle("on", Number(el.dataset.v) <= currentRating);
    });
  }

  function resetForm(){
    document.getElementById("f-title").value = "";
    document.getElementById("f-author").value = "";
    document.getElementById("f-date").value = "";
    document.getElementById("f-memo").value = "";
    populateCategorySelect(DEFAULT_CATEGORY);
    currentRating = 0;
    renderStars();
    editingId = null;
    document.getElementById("save-btn").textContent = "棚に並べる";
    document.getElementById("cancel-edit-btn").style.display = "none";
  }

  document.getElementById("save-btn").addEventListener("click", async ()=>{
    const title = document.getElementById("f-title").value.trim();
    if(!title){
      alert("タイトルを入れてください");
      return;
    }
    const author = document.getElementById("f-author").value.trim();
    const date = document.getElementById("f-date").value || new Date().toISOString().slice(0,10);
    const memo = document.getElementById("f-memo").value.trim();
    const category = document.getElementById("f-category").value || DEFAULT_CATEGORY;

    let books = await loadBooks();
    if(editingId){
      books = books.map(b => b.id === editingId
        ? { ...b, title, author, date, memo, category, rating: currentRating }
        : b);
    } else {
      books.push({
        id: Date.now(),
        title, author, date, memo, category,
        rating: currentRating,
      });
    }
    const result = await saveBooks(books);
    if(!result.ok){
      alert(result.error || "保存できませんでした");
      return;
    }
    resetForm();
    render();
  });

  document.getElementById("cancel-edit-btn").addEventListener("click", resetForm);

  function startEdit(id){
    const book = booksCache.find(b => b.id === id);
    if(!book) return;
    document.getElementById("f-title").value = book.title;
    document.getElementById("f-author").value = book.author;
    document.getElementById("f-date").value = book.date;
    document.getElementById("f-memo").value = book.memo;
    populateCategorySelect(book.category || DEFAULT_CATEGORY);
    currentRating = book.rating;
    renderStars();
    editingId = id;
    document.getElementById("save-btn").textContent = "更新する";
    document.getElementById("cancel-edit-btn").style.display = "inline-block";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  async function deleteBook(id){
    if(!confirm("この記録を削除しますか？")) return;
    await saveBooks(booksCache.filter(b => b.id !== id));
    if(editingId === id) resetForm();
    if(selectedId === id) selectedId = null;
    render();
  }

  function selectSpine(id){
    selectedId = (selectedId === id) ? null : id;
    render();
  }

  function closeDetail(){
    selectedId = null;
    render();
  }

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("sort").addEventListener("change", render);

  function renderStats(){
    const all = booksCache;
    const statsEl = document.getElementById("stats");
    const total = all.length;
    const avg = total ? (all.reduce((s,b)=>s+b.rating,0) / total).toFixed(1) : "0.0";
    const now = new Date();
    const thisMonth = all.filter(b=>{
      const d = new Date(b.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;
    statsEl.innerHTML = `
      <div class="stat"><div class="num">${total}</div><div class="lbl">総冊数</div></div>
      <div class="stat"><div class="num">${thisMonth}</div><div class="lbl">今月</div></div>
      <div class="stat"><div class="num">${avg}</div><div class="lbl">平均評価</div></div>
    `;
  }

  async function render(){
    const keyword = document.getElementById("search").value.trim().toLowerCase();
    const sortMode = document.getElementById("sort").value;

    let books = await loadBooks();

    if(keyword){
      books = books.filter(b =>
        (b.title || "").toLowerCase().includes(keyword) ||
        (b.author || "").toLowerCase().includes(keyword)
      );
    }

    books.sort((a,b)=>{
      if(sortMode === "date-desc") return (b.date || "").localeCompare(a.date || "");
      if(sortMode === "date-asc") return (a.date || "").localeCompare(b.date || "");
      if(sortMode === "rating-desc") return b.rating - a.rating;
      if(sortMode === "rating-asc") return a.rating - b.rating;
      return 0;
    });

    const shelvesEl = document.getElementById("shelves");
    const hint = document.getElementById("shelf-hint");
    const detailWrap = document.getElementById("detail-wrap");
    const count = document.getElementById("count");
    const all = booksCache;
    count.textContent = keyword
      ? `本棚（${books.length}件 見つかりました・全${all.length}件中）`
      : `本棚（全${all.length}件）`;

    renderStats();
    applyPlanUi();

    if(all.length === 0){
      shelvesEl.innerHTML = "";
      hint.textContent = "まだ記録がありません。最初の1冊を並べてみましょう。";
      detailWrap.innerHTML = "";
      return;
    }

    if(books.length === 0){
      shelvesEl.innerHTML = "";
      hint.textContent = "見つかりませんでした";
      detailWrap.innerHTML = "";
      return;
    }

    hint.textContent = "本をタップすると詳細が見られます";
    populateCategorySelect(document.getElementById("f-category").value || DEFAULT_CATEGORY);

    shelvesEl.innerHTML = allCategories().map(cat => {
      const catBooks = books.filter(b => (b.category || DEFAULT_CATEGORY) === cat);
      const spines = catBooks.map(b => {
        const height = 106 + (b.rating || 0) * 9 + (b.title.length % 5) * 3;
        const width = 30 + Math.min(12, Math.floor(b.title.length / 5));
        const selected = b.id === selectedId ? " selected" : "";
        return `
          <div class="spine${selected}" style="background:${spineColor(b.title)};height:${height}px;width:${width}px" onclick="selectSpine(${b.id})" title="${escapeHtml(b.title)}">
            <span class="spine-text">${escapeHtml(b.title)}</span>
          </div>
        `;
      }).join("");
      return `
        <div class="shelf-label">${cat}（${catBooks.length}件）</div>
        <div class="bookshelf-outer">
          <div class="bookshelf-row">${spines}</div>
          <div class="plank"></div>
        </div>
      `;
    }).join("");

    renderDetail();
  }

  function renderDetail(){
    const detailWrap = document.getElementById("detail-wrap");
    const b = booksCache.find(x => x.id === selectedId);
    if(!b){
      detailWrap.innerHTML = "";
      return;
    }
    detailWrap.innerHTML = `
      <div class="book fade-in">
        <div class="top-row">
          <h3>${escapeHtml(b.title)}</h3>
          <div class="stars">${"★".repeat(b.rating)}${"☆".repeat(5 - b.rating)}</div>
        </div>
        <div class="author">${escapeHtml(b.author || "著者不明")}</div>
        <div class="date">${b.date || ""}</div>
        ${b.memo ? `<div class="memo">${escapeHtml(b.memo)}</div>` : ""}
        <div class="actions">
          ${currentUser && currentUser.role === "admin" ? `
            <button class="btn small ghost" onclick="startEdit(${b.id})">編集</button>
            <button class="btn small danger" onclick="deleteBook(${b.id})">削除</button>
          ` : ""}
          <button class="btn small ghost" onclick="closeDetail()">閉じる</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  initAuth();
</script>

</body>
</html>
